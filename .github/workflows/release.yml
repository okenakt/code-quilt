# Builds the release archives and, for a vX.Y.Z tag, drafts a GitHub release with them.
# Run it by hand (workflow_dispatch) to build the archives as workflow artifacts only.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the workspace version and has a changelog entry
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          grep -qxF "## $GITHUB_REF_NAME" CHANGELOG.md || { echo "CHANGELOG.md has no ## $GITHUB_REF_NAME"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: board/package-lock.json
      - name: Install the board's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Build
        run: |
          cargo build --release -p cq -p cq-orchestrator
          cd board && npm ci && npx tauri build
      - name: Package
        run: |
          mkdir pkg
          for b in cq cq-orchestrator cq-board; do cp "target/release/$b${{ matrix.exe }}" pkg/; done
          cp README.md LICENSE pkg/
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "codequilt-${{ matrix.target }}.zip" ./pkg/*
          else
            cp board/src-tauri/icons/128x128.png pkg/codequilt.png
            tar -czf "codequilt-${{ matrix.target }}.tar.gz" -C pkg .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: codequilt-${{ matrix.target }}.*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          (cd dist && sha256sum codequilt-* > SHA256SUMS)
          awk -v h="## $GITHUB_REF_NAME" '$0 == h { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --notes-file notes.md dist/*
