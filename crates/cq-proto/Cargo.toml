[package]
name = "cq-proto"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
