[package]
name = "cq"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cq-client = { path = "../cq-client" }
cq-protocol = { path = "../cq-protocol", features = ["local"] }
dirs = "7.0.0"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
toml_edit = "0.25.15"
vt100 = "0.16.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
